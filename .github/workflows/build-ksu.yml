name: Build KernelSU LKM
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone DDK
        run: git clone https://github.com/Ylarod/ddk.git ddk

      - name: Install python dependencies
        working-directory: ddk
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Compile KernelSU
        working-directory: ddk
        run: |
          python3 kmod/build.py --kmi 6.1-android14-11 --source https://github.com/tiann/KernelSU.git#main

      - name: Upload ko
        uses: actions/upload-artifact@v4
        with:
          name: KSU-ko
          path: ddk/out/
